name: ARGUS extension

on:
  push:
    paths:
      - 'scripts/ARGUS/**'
      - 'data/AnnotationCodebook.csv'
      - 'data/CIPromptTemplate.csv'
      - 'data/CGPromptTemplate.csv'
      - 'requirements.txt'
      - 'requirements-extension.txt'
      - 'vscode-extension/**'
      - '.github/workflows/argus-extension.yml'
  pull_request:
    paths:
      - 'scripts/ARGUS/**'
      - 'data/AnnotationCodebook.csv'
      - 'data/CIPromptTemplate.csv'
      - 'data/CGPromptTemplate.csv'
      - 'requirements.txt'
      - 'requirements-extension.txt'
      - 'vscode-extension/**'
      - '.github/workflows/argus-extension.yml'
  workflow_dispatch:

jobs:
  dependencies:
    name: Install Python dependencies (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
          - os: ubuntu-latest
            python: '3.14'
          - os: macos-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-extension.txt
      - run: python -m compileall -q scripts/ARGUS

  package:
    name: Package universal VSIX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: vscode-extension
      - run: npm run build
        working-directory: vscode-extension
      - run: npm test
        working-directory: vscode-extension
      - run: npm run package
        working-directory: vscode-extension
      - uses: actions/upload-artifact@v4
        with:
          name: argus-rationale-universal
          path: vscode-extension/argus-rationale-*.vsix
